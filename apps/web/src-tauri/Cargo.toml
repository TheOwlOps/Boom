[package]
name = "boom_desktop"
version = "0.1.0"
description = "Boom Agent Harness Desktop App"
authors = ["Ryan"]
license = ""
repository = ""
edition = "2021"

[[bin]]
name = "boom-desktop"
path = "src/main.rs"

[lib]
name = "boom_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4" }
tauri-plugin-log = "2"
