[package]
name = "boom-core"
version = "0.1.0"
edition = "2021"
description = "Independent Rust core for the Boom desktop app (agent harness, tools, LLM providers, HTTP server, storage)"
license = "MIT"

[lib]
name = "boom_core"
path = "src/lib.rs"

[[bin]]
name = "boom-core-server"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Errors
thiserror = "2"
async-trait = "0.1"
# HTTP server
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
# HTTP client (pure-Rust TLS, no system OpenSSL)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
# SQLite (amalgamation bundled, no system dependency)
rusqlite = { version = "0.40", features = ["bundled"] }
dirs = "5"
# Tools
base64 = "0.22"
sha2 = "0.10"
md5 = "0.7"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
glob = "0.3"
shell-words = "1"
regex = "1"
ipnet = "2"

[dev-dependencies]
tempfile = "3"
