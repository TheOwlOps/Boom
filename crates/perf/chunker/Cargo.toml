[package]
name = "boom-chunk"
version = "0.1.0"
edition = "2021"
description = "Unicode-safe text chunker with line-boundary-aware overlap (Rust side of Boom's rust bridge)"

[[bin]]
name = "boom-chunk"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
