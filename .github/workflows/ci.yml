name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install httpx pydantic
      - name: Syntax check
        run: python3 -m compileall -q agent/src gateway
      - name: Run evals
        run: |
          # Fail the job if any eval script fails (pipefail so a failing
          # python3 is not masked by the trailing `tail`).
          set -o pipefail
          FAILED=0
          for f in evals/test_*.py; do
            echo "=== $f ==="
            python3 "$f" 2>&1 | tail -3 || FAILED=1
          done
          exit $FAILED

  desktop:
    name: Desktop UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package.json
      - name: Install
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/desktop
        run: npx tsc --noEmit
      - name: Build
        working-directory: apps/desktop
        run: npm run build

  nix:
    name: Nix flake check
    runs-on: ubuntu-latest
    continue-on-error: true  # TODO: fix npmDepsHash placeholder in pkg-desktop.nix
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Flake check
        run: nix flake check --no-build

  rust:
    name: Rust (fmt + clippy + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: cargo audit (advisory scan, non-blocking)
        continue-on-error: true
        run: |
          cargo install --quiet cargo-audit 2>/dev/null || true
          cargo audit || echo "cargo audit unavailable or advisories found"
