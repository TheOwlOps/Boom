name: Zalo Bridge Binary

# Builds the standalone Zalo Personal bridge executables (PyInstaller,
# one-file, no Python needed on the target machine) and publishes them to
# the separate `zalo-bridge-v1` GitHub release — NOT the desktop release.
# The Boom desktop app lazy-downloads the matching binary from that release
# on first use ($BOOM_HOME/bin/), so the installers stay the same size.

on:
  push:
    branches: [main]
    paths: ["channels/zalo-personal/**"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish binaries to the zalo-bridge-v1 release"
        type: boolean
        default: true

permissions:
  contents: write # needed to create/update the zalo-bridge-v1 release

env:
  RELEASE_TAG: zalo-bridge-v1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: zalo-bridge-linux-x86_64
          - os: windows-latest
            asset: zalo-bridge-windows-x86_64.exe
          - os: macos-latest
            asset: zalo-bridge-macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: channels/zalo-personal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system zbar (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0

      - name: Install system zbar (macOS)
        if: runner.os == 'macOS'
        run: brew install zbar

      # Windows: no system zbar available in CI — the bridge answers
      # /qr-lookup-image with 501 there (graceful, documented).

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone binary
        run: pyinstaller bridge.spec

      - name: Smoke test (boot + /status)
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.asset }}"
          # Windows asset name carries .exe; the spec outputs zalo-bridge(.exe).
          if [ ! -f "$BIN" ]; then
            BIN=$(ls dist/zalo-bridge* | head -1)
          fi
          echo "Testing $BIN"
          PORT=17899
          BOOM_ZALO_BRIDGE_PORT=$PORT "$BIN" > smoke.log 2>&1 &
          PID=$!
          for i in $(seq 1 30); do
            if curl -sf --max-time 3 "http://127.0.0.1:$PORT/status" > /dev/null; then
              break
            fi
            sleep 2
          done
          curl -sf --max-time 5 "http://127.0.0.1:$PORT/status" | head -c 300
          echo
          kill $PID 2>/dev/null || true
          echo "SMOKE OK"

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          SRC=$(ls dist/zalo-bridge* | head -1)
          cp "$SRC" "artifacts/${{ matrix.asset }}"
          (cd artifacts && sha256sum "${{ matrix.asset }}" | awk '{print $1}' > "${{ matrix.asset }}.sha256")
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: channels/zalo-personal/artifacts/${{ matrix.asset }}*
          if-no-files-found: error

  publish:
    needs: build
    # Push builds are CI-only; publishing happens on manual dispatch.
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Publish to zalo-bridge-v1 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -la dist-artifacts/
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists — uploading (clobber)."
          else
            gh release create "$RELEASE_TAG" \
              --title "Zalo Bridge v1 (standalone binaries)" \
              --notes "Standalone Zalo Personal bridge executables built with PyInstaller (one-file, no Python required). The Boom desktop app lazy-downloads the matching binary from this release on first use and verifies its SHA256. Not part of the desktop installer releases."
          fi
          gh release upload "$RELEASE_TAG" dist-artifacts/* --clobber
          echo "Published: https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"
