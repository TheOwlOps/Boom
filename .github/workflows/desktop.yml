name: Desktop Build

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.0, without the 'v' prefix)"
        required: true
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: msi
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/web/src-tauri -> target

      - name: Install frontend deps
        run: npm install --no-audit --no-fund

      # Python 3.12 is required to run PyInstaller for the backend sidecar.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Build the Python backend into a standalone sidecar binary that Tauri
      # bundles (expected at gateway/binaries/boom-backend-<target-triple>).
      # Runs from the repo root (job defaults work in apps/web), with bash on
      # all runners so the build script works on Windows too.
      - name: Build Python backend
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)   BACKEND_OS=linux ;;
            Windows) BACKEND_OS=windows ;;
            macOS)   BACKEND_OS=macos ;;
            *) echo "error: unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
          esac
          pip install pyinstaller
          bash scripts/build-backend.sh "$BACKEND_OS" "${{ matrix.target }}"
          BIN="gateway/binaries/boom-backend-${{ matrix.target }}"
          if [ "$BACKEND_OS" = "windows" ]; then BIN="${BIN}.exe"; fi
          if [ ! -f "$BIN" ]; then
            echo "error: backend binary not found at $BIN" >&2
            ls -la gateway/binaries/ || true
            exit 1
          fi
          echo "Backend sidecar binary ready: $BIN"

      - name: Build Tauri
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: boom-desktop-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/
          retention-days: 30

      # SignPath opt-in gate. GitHub forbids the `secrets` context in step
      # `if:` conditions (the whole run fails workflow validation), so token
      # presence is probed once here and consumed via step outputs below.
      # Runs only on the Windows matrix leg; skipped everywhere else.
      - name: Check SignPath configuration
        id: signpath
        if: runner.os == 'Windows'
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ -n "${SIGNPATH_API_TOKEN:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # Authenticode-sign the Windows installer via SignPath (free code signing
      # for open source). Skipped silently unless the SIGNPATH_* secrets are
      # configured, so builds without signing keep working exactly as before.
      # SignPath only accepts an already-uploaded GitHub artifact, so this
      # step runs AFTER the upload above; the signed files land in signed/
      # and are re-uploaded in the next step.
      - name: Sign Windows installer (SignPath)
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/

      # Re-upload the signed installer under a "-signed" artifact name so the
      # release job can pick it up and prefer it over the unsigned build.
      - name: Upload signed artifacts
        if: steps.signpath.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: boom-desktop-${{ matrix.target }}-signed
          path: signed/
          retention-days: 30

  # Publish installers + Tauri updater v2 `latest.json` to a GitHub release.
  # Runs after all 4 build jobs succeed. Idempotent: if the release already
  # exists, assets are re-uploaded with --clobber instead of failing.
  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VERSION="${{ inputs.version }}"
          else
            # Tag trigger: desktop-v<version> -> strip the "desktop-v" prefix.
            RAW_VERSION="${GITHUB_REF_NAME#desktop-v}"
          fi
          VERSION="${RAW_VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "error: resolved version '$VERSION' does not look like X.Y.Z" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: boom-desktop-*
          path: dist/
          merge-multiple: true

      - name: Locate installers and signature files
        id: files
        run: |
          set -euo pipefail
          APPIMAGE="$(find dist -name '*.AppImage' ! -name '*.sig' | head -1)"
          # Prefer the SignPath-signed MSI (downloaded to the dist/ root) over
          # the unsigned build output (dist/msi/). When SignPath is not
          # configured there is no signed artifact, so this falls back to the
          # unsigned MSI and behaves exactly as before.
          MSI="$(find dist -maxdepth 2 -name '*.msi' -not -path '*/msi/*' | head -1)"
          if [ -z "$MSI" ]; then
            MSI="$(find dist -name '*.msi' | head -1)"
          fi
          DMG_X64="$(find dist -name '*_x64.dmg' | head -1)"
          DMG_AARCH64="$(find dist -name '*_aarch64.dmg' | head -1)"
          for f in APPIMAGE MSI DMG_X64 DMG_AARCH64; do
            if [ -z "${!f}" ]; then
              echo "error: installer not found for $f" >&2
              ls dist/
              exit 1
            fi
          done
          echo "appimage_file=$(basename "$APPIMAGE")" >> "$GITHUB_OUTPUT"
          echo "msi_file=$(basename "$MSI")" >> "$GITHUB_OUTPUT"
          echo "dmg_x64_file=$(basename "$DMG_X64")" >> "$GITHUB_OUTPUT"
          echo "dmg_aarch64_file=$(basename "$DMG_AARCH64")" >> "$GITHUB_OUTPUT"

      - name: Create release if missing (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; assets will be re-uploaded with --clobber."
          else
            gh release create "$TAG" \
              --title "Boom Desktop v${{ steps.version.outputs.version }}" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi

      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_FILE: ${{ steps.files.outputs.appimage_file }}
          MSI_FILE: ${{ steps.files.outputs.msi_file }}
          DMG_X64_FILE: ${{ steps.files.outputs.dmg_x64_file }}
          DMG_AARCH64_FILE: ${{ steps.files.outputs.dmg_aarch64_file }}
          SIG_DIR: dist
        run: |
          set -euo pipefail
          gh release view "${{ steps.version.outputs.tag }}" --json body -q .body > /tmp/release-notes.md
          bash scripts/generate-latest-json.sh \
            "${{ steps.version.outputs.version }}" \
            /tmp/release-notes.md \
            -o latest.json
          python3 -c "import json; d=json.load(open('latest.json')); assert len(d['platforms'])==4; print('latest.json valid:', d['version'])"

      # Checksums for every release asset, so users can verify installer
      # integrity (the app is not code-signed yet).
      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          # latest.json is generated at the repo root; copy it under dist/
          # so the checksum file covers every asset attached to the release.
          cp latest.json dist/latest.json
          bash scripts/generate-checksums.sh dist/

      - name: Upload installers, signatures, latest.json and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          # Installer files plus any .sig files tauri build produced.
          # Artifacts land in per-platform subdirs under dist/ (merge-multiple),
          # so flatten them to dist/ root first.
          shopt -s globstar nullglob
          mkdir -p dist/flat
          for f in dist/**/*.AppImage dist/**/*.msi dist/**/*.dmg dist/**/*.sig; do
            cp "$f" dist/flat/ 2>/dev/null || true
          done
          # If SignPath signing ran, both the signed MSI (dist/<name>.msi) and
          # the unsigned one (dist/msi/<name>.msi) were flattened above and the
          # unsigned copy may have won the filename collision. Overwrite
          # explicitly so the release always ships the signed installer.
          # No-op when signing is disabled (no signed MSI at dist/ root).
          SIGNED_MSI="$(find dist -maxdepth 1 -name '*.msi' | head -1)"
          if [ -n "$SIGNED_MSI" ]; then
            cp -f "$SIGNED_MSI" "dist/flat/$(basename "$SIGNED_MSI")"
            echo "Shipping SignPath-signed MSI: $(basename "$SIGNED_MSI")"
          fi
          ASSETS=(dist/flat/* latest.json dist/SHA256SUMS.txt)
          ls -la "${ASSETS[@]}"
          gh release upload "$TAG" "${ASSETS[@]}" --clobber
          echo "Uploaded ${#ASSETS[@]} assets to $TAG"
          echo "Updater endpoint: https://github.com/TheOwlOps/Boom/releases/download/$TAG/latest.json"
